name: realfood

x-app-build: &app-build
  context: .
  dockerfile: prototype-mobile/Dockerfile
  additional_contexts:
    runtime_bundle: ${RUNTIME_BUNDLE_CONTEXT:-./prototype-mobile/runtime-empty}
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    RUNTIME_BUNDLE_FILENAME: ${RUNTIME_BUNDLE_FILENAME:-runtime.tar.gz}
    RUNTIME_BUNDLE_SHA256: ${RUNTIME_BUNDLE_SHA256:-}

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: "${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z}"
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data

  minio-init:
    image: "${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z}"
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"; do sleep 2; done
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        sed "s/__BUCKET__/$${MINIO_BUCKET}/g" /policies/minio-app-policy.json > /tmp/minio-app-policy.json
        sed "s/__BUCKET__/$${MINIO_BUCKET}/g" /policies/minio-publish-policy.json > /tmp/minio-publish-policy.json
        mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}"
        mc admin policy create local realfood-app /tmp/minio-app-policy.json
        mc admin policy attach local realfood-app --user "$${MINIO_APP_ACCESS_KEY}"
        mc admin user add local "$${MINIO_PUBLISH_ACCESS_KEY}" "$${MINIO_PUBLISH_SECRET_KEY}"
        mc admin policy create local realfood-publisher /tmp/minio-publish-policy.json
        mc admin policy attach local realfood-publisher --user "$${MINIO_PUBLISH_ACCESS_KEY}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      MINIO_PUBLISH_ACCESS_KEY: ${MINIO_PUBLISH_ACCESS_KEY}
      MINIO_PUBLISH_SECRET_KEY: ${MINIO_PUBLISH_SECRET_KEY}
    volumes:
      - ./ops:/policies:ro

  migrate:
    build: *app-build
    command: ["node", "scripts/migrate-db.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  assets:
    build: *app-build
    command: ["node", "scripts/upload-assets.mjs"]
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_PUBLISH_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_PUBLISH_SECRET_KEY}

  app:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      assets: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.10-alpine}"
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    profiles: ["ops"]
    build:
      context: ./ops
      dockerfile: Dockerfile.backup
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_KEY:-}
      RESTORE_SNAPSHOT: ${RESTORE_SNAPSHOT:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-realfood_postgres-data}
  minio-data:
    name: ${MINIO_VOLUME_NAME:-realfood_minio-data}
  caddy-data:
    name: ${CADDY_DATA_VOLUME_NAME:-realfood_caddy-data}
  caddy-config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-realfood_caddy-config}
